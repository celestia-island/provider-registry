# maintained; `sha256`/`fetched_at` are owned by scripts/fetch_logos.py (do
# not hand-edit).
#
# SOURCE PRIORITY (user ruling 2026-11-11): a current first-party vendor
# asset wins over the dedicated AI-provider icon library. The library
# (@lobehub/icons-static-svg, MIT, pinned 1.102.0) covers providers without
# a verified official asset; simple-icons and letter fallback follow. Most
# entries are uniform 24x24 mono marks; Z.ai's official 30x30 brand plate and
# doubao's color mark are the documented exceptions.
#
# mode = "mono"   -> the SVG carries fill=currentColor, follows the theme text.
# mode = "brand"  -> original vendor fills kept (multi-color marks).

