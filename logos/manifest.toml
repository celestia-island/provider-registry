# Provider logo manifest — the hand-authored SOURCING decision per provider.
# `source`/`source_url`/`mode`/`pre_clean`/`license`/`brand_color` are hand-maintained;
# `sha256`/`fetched_at` are owned by scripts/fetch_logos.py (do not hand-edit).
#
# mode = "mono"   -> the SVG carries fill=currentColor, follows the theme text.
# mode = "brand"  -> original vendor fills kept (multi-color marks).
#
# A provider WITHOUT an entry here has no usable vector source yet and keeps
# the consumer's letter fallback (see validate_logos.py's LETTER_FALLBACK).
#
# Seeded 2026-11-10. simple-icons entries are pinned to 16.37.0 (the version
# the bytes were taken from); official entries point at the vendor's own asset.
# together/runway ship their marks only inside a brand ZIP with no per-file
# URL — the committed bytes were seeded from that ZIP by hand; a refetch of
# the recorded source_url will fail until fetch_logos grows ZIP support, so
# refresh those two by re-unzipping and re-running this script's normalization
# (scripts/fetch_logos.py --check still verifies the committed bytes).

