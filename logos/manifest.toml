# Provider logo manifest — the hand-authored SOURCING decision per provider.
# `source`/`source_url`/`mode`/`pre_clean`/`license`/`brand_color` are hand-
# maintained; `sha256`/`fetched_at` are owned by scripts/fetch_logos.py (do
# not hand-edit).
#
# SOURCE PRIORITY (user ruling 2026-11-11): a current first-party vendor
# asset wins over the dedicated AI-provider icon library. The library
# (@lobehub/icons-static-svg, MIT, pinned 1.102.0) covers providers without
# a verified official asset; simple-icons and letter fallback follow. Most
# entries are uniform 24x24 mono marks; Z.ai's official 30x30 brand plate and
# doubao's color mark are the documented exceptions.
#
# mode = "mono"   -> the SVG carries fill=currentColor, follows the theme text.
# mode = "brand"  -> original vendor fills kept (multi-color marks).

# [<id>.combine] — the lockup face (mark + wordmark), composed by
# scripts/fetch_logos_combines.py from the pinned library. Hand fields:
# lobehub_mark / lobehub_text (icon stems in the pinned package; -color is
# probed on the mark stem), word (the wordmark text), optional tint
# (defaults to the provider brand_color), optional local_* file overrides;
# sha256 / fetched_at are owned by the combine script (do not hand-edit).
# The mono tree above is untouched: it remains the fallback asset.

