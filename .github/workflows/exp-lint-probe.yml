name: Exp Lint Probe

# Throwaway probe: does a FAILING duplicate of the required context block the
# PR even when the real lint lane succeeded?
on:
  pull_request:

jobs:
  probe:
    name: "lint-commits / Lint commit messages"
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "probe deliberately fails under the required context name"
          exit 1
