name: Catalog Validate

# The registry is data, not code: ~1100 model rows and 60+ entrypoint configs that
# consumers read directly. Nothing else checks them, so a typo'd key or a missing
# provider_id ships silently and a consumer just sees a smaller catalog. This is
# the gate (scripts/validate_catalog.py).
#
# Self-hosted because the org keeps CI compute on the farm (AGENTS [[ci]], ci-ops
# 8.2); hosted runs are reserved for the two lint exceptions documented in
# _ledger/ci-state.md (re-check 2026-11-01). The job is a stdlib-only Python pass,
# so it is cheap on the farm.
#
# One in-flight run per ref (ci-ops 8.3.3) so a superseded push cancels itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  catalog:
    # Fork pull requests must not execute on the org's self-hosted farm
    # (AGENTS [[ci]]; celestia-devtools workflow_audit's fork-guard rule). This is
    # defense in depth, not an absolute boundary: GitHub's fork-PR approval gate
    # is the outer control, and a fork can propose edits to this file. Keeping the
    # canonical guard here still stops every fork run that reaches the job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
        env:
          # The runner rewrites github.com/celestia-island/* to a local bare
          # mirror; keep this checkout on the real remote (ci-ops 8.2).
          GIT_CONFIG_COUNT: "0"

      - name: Validate the catalog data files
        run: python3 scripts/validate_catalog.py

      - name: Validate the MDD descriptors
        run: python3 scripts/validate_descriptors.py

      # The validators only prove the shipped tree is clean; the test suites
      # pin the contract itself (the verbatim search protocol vocabulary, the
      # registry<->directory invariants). Without this step a PR that loosens
      # validate_catalog.py would pass its own relaxed output — the tests are
      # where "fails here instead of shipping" actually lives.
      - name: Run the catalog test suites
        run: |
          python3 scripts/test_validate_search.py
          python3 scripts/test_update_models.py
