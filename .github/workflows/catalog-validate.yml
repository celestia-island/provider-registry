name: Catalog Validate

# The registry is data, not code: ~1100 model rows and 60+ entrypoint configs that
# consumers read directly. Nothing else checks them, so a typo'd key or a missing
# provider_id ships silently and a consumer just sees a smaller catalog. This is
# the gate (scripts/validate_catalog.py).
#
# Self-hosted because the org keeps CI compute on the farm (AGENTS [[ci]], ci-ops
# 8.2); hosted runs are reserved for the two lint exceptions documented in
# _ledger/ci-state.md (re-check 2026-11-01). The job is a stdlib-only Python pass,
# so it is cheap on the farm.
#
# One in-flight run per ref (ci-ops 8.3.3) so a superseded push cancels itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  catalog:
    # Fork pull requests must not execute on the org's self-hosted farm
    # (AGENTS [[ci]]; celestia-devtools workflow_audit's fork-guard rule). This is
    # defense in depth, not an absolute boundary: GitHub's fork-PR approval gate
    # is the outer control, and a fork can propose edits to this file. Keeping the
    # canonical guard here still stops every fork run that reaches the job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
        env:
          # The runner rewrites github.com/celestia-island/* to a local bare
          # mirror; keep this checkout on the real remote (ci-ops 8.2).
          GIT_CONFIG_COUNT: "0"

      - name: Validate the catalog data files
        run: python3 scripts/validate_catalog.py

      - name: Validate the MDD descriptors
        run: python3 scripts/validate_descriptors.py

      # `scripts/test_update_models.py` imports the `toml` wheel (the writer-side
      # parser); the validators themselves are stdlib-only. The Debian 12 runners
      # ship python3.11 without it, and the suites step below only started running
      # that test in #32, which is why the gate went red on master. Bounded
      # preflight: use the runner's `toml` when it is importable, otherwise install
      # it once into a local venv.
      #
      # A bare `python3 -m pip install toml` cannot work here: Debian marks the
      # system interpreter EXTERNALLY-MANAGED (PEP 668), so pip refuses before it
      # even looks at the network — verified on a Debian 12 / python3.11 image:
      # `error: externally-managed-environment … pass --break-system-packages`.
      # The venv form is the org's standard on these runners (celestia-devtools
      # ci.yml/audit.yml, evernight, official-plugins) and is confirmed green on
      # the farm. Failure is loud and single-attempt: a green run that skipped the
      # suite would be worse than a red one.
      - name: Ensure the `toml` wheel for the model-sync suite
        run: |
          set -euo pipefail
          if python3 -c 'import toml' 2>/dev/null; then
            python3 -c 'import toml; print(f"toml {toml.__version__} from the runner interpreter")'
            exit 0
          fi
          echo "runner python3 has no 'toml' (PEP 668 forbids installing into the system env); using .venv"
          if ! python3 -m venv .venv; then
            echo "::error::cannot create a venv (is python3-venv installed on this runner?) — the model-sync suite needs the 'toml' wheel, so the catalog gate stays red on purpose instead of silently skipping the suite"
            exit 1
          fi
          if ! .venv/bin/pip install --quiet --disable-pip-version-check "toml>=0.10,<1.0"; then
            echo "::error::installing 'toml' failed: the runner cannot reach a package index (or pip is broken). The model-sync suite cannot run, so the catalog gate stays red on purpose instead of silently skipping it"
            exit 1
          fi
          .venv/bin/python -c 'import toml; print(f"toml {toml.__version__} from .venv")'

      # The validators only prove the shipped tree is clean; the test suites
      # pin the contract itself (the verbatim search protocol vocabulary, the
      # registry<->directory invariants, the shape of the published catalog
      # index). Without this step a PR that loosens validate_catalog.py would
      # pass its own relaxed output — the tests are where "fails here instead
      # of shipping" actually lives.
      - name: Run the catalog test suites
        run: |
          set -euo pipefail
          # `.venv` exists only when the runner's python3 lacked `toml`.
          PY=python3
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; fi
          "$PY" scripts/test_validate_search.py
          "$PY" scripts/test_update_models.py
          "$PY" scripts/test_build_catalog_index.py
