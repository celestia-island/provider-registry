name: Sync Provider Models

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      providers:
        description: 'Providers to update (comma-separated, or "all")'
        required: false
        default: 'all'
      source:
        description: 'Data source: openrouter, modelsdev, or all'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - openrouter
          - modelsdev
      dry_run:
        description: 'Dry run (no commit pushed)'
        required: false
        default: false
        type: boolean

concurrency:
  group: provider-sync
  cancel-in-progress: false

jobs:
  sync-models:
    runs-on: ubuntu-latest
    permissions:
      # contents: commit the sync branch; pull-requests: open the sync PR and
      # request auto-merge. Master is protected (squash via PR only) — the old
      # direct push died with GH006 on every run since the org tightened
      # branch protection (2026-10-02), which is how the catalog fell a
      # generation behind in the first place.
      contents: write
      pull-requests: write

    steps:
      - name: Checkout master branch (config-table source of truth)
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install toml

      - name: Sync models (OpenRouter + models.dev)
        id: sync
        run: |
          SOURCE="${{ github.event.inputs.source || 'all' }}"
          ARGS="--source ${SOURCE} --entrypoint-mode --individual-models"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ inputs.providers }}" ] && [ "${{ inputs.providers }}" != "all" ]; then
              ARGS="$ARGS --providers ${{ inputs.providers }}"
            fi
          fi

          echo "Running: python3 scripts/update_models.py $ARGS"
          python3 scripts/update_models.py $ARGS

          if git diff --exit-code --quiet entrypoint models; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No model changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Model changes detected:"
            git diff --stat entrypoint models
            {
              echo "diff_summary<<EOF"
              git diff --stat entrypoint models
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Push sync branch and open auto-merge PR
        if: steps.sync.outputs.has_changes == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/auto-model-sync"
          UPDATED_AT=$(date -u +"%Y-%m-%dT:%MZ")
          git add entrypoint models
          git commit -m "🔄 Sync provider model list (updated ${UPDATED_AT})."
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
          # The PR title repeats the commit subject so the commit lint passes
          # and auto-merge can fire once required checks are green. Creating
          # the PR needs the repository setting "Allow GitHub Actions to
          # create and approve pull requests"; when it is off, the pushed
          # branch IS the artifact — warn and stay green instead of failing
          # every scheduled run.
          if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
            if ! gh pr create --head "$BRANCH" --title "🔄 Sync provider model list (updated ${UPDATED_AT})." --body "Automated catalog refresh from the aggregator sources (openrouter / models.dev). Opened by the scheduled Sync Provider Models workflow; auto-merges once the required lint passes."; then
              echo "::warning::Actions is not permitted to open PRs on this repository (Settings → Actions → General → Allow GitHub Actions to create and approve pull requests). Branch ${BRANCH} is pushed and ready — an operator should open and merge the sync PR."
            fi
          fi
          # Auto-merge needs the repository feature enabled; if it is not, the
          # PR simply stays open for an operator.
          gh pr merge "$BRANCH" --squash --auto --delete-branch 2>/dev/null || echo "::warning::auto-merge unavailable — sync PR left open for an operator"

      - name: Summary
        if: always()
        run: |
          SOURCE="${{ github.event.inputs.source || 'all' }}"
          if [ "${{ steps.sync.outputs.has_changes }}" == "true" ]; then
            if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" == "true" ]; then
              echo "### Dry Run Complete (source: \`${SOURCE}\`)" >> $GITHUB_STEP_SUMMARY
              echo "Changes were detected but not committed (dry run mode)." >> $GITHUB_STEP_SUMMARY
            else
              echo "### Sync PR opened (source: \`${SOURCE}\`)" >> $GITHUB_STEP_SUMMARY
              echo "Model list changes pushed to \`chore/auto-model-sync\` and proposed via PR (master only advances by squash merge)." >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.sync.outputs.diff_summary }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### No Changes (source: \`${SOURCE}\`)" >> $GITHUB_STEP_SUMMARY
            echo "Model list is already up to date." >> $GITHUB_STEP_SUMMARY
          fi
