# ---- Search providers -------------------------------------------------------
#
# Search is a separate capability class from LLM chat: a search provider takes a
# query and returns ranked web results, it is not a model you talk to. The wire
# contracts live in `search/<provider>/<variant>.toml`; the groups below only
# categorize those providers for setup UIs, exactly like the LLM groups above.
#
# Rules the validator enforces (scripts/validate_catalog.py):
#   * every `search.*` id must have a `search/<id>/` directory, and every
#     `search/<id>/` directory must appear here exactly once;
#   * rows carry `id`, `name`, `description` and, when known, `website_domain`.
#
# Metadata semantics:
#   * `requires_key = false` — the endpoint is callable without a credential;
#   * `verified = true` — the endpoint has actually been exercised against the
#     live vendor API from this workspace. `false` means only "not exercised
#     yet", never "broken" or "unavailable";
#   * `is_official` — the vendor documents and supports the endpoint. DuckDuckGo
#     has no official search API, so its HTML entry is `false`.

[[search.aggregators]]
id = "seia"
name = "Seia"
website_domain = ""
description = "Self-hosted search gateway that fans one query out to a provider chain"
is_official = false
requires_key = false
verified = false

